<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notenbuch SJ 26/27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: oklch(98.2% 0.003 250);
    --surface: oklch(96.2% 0.004 250);
    --surface-2: oklch(93.5% 0.005 250);
    --ink: oklch(23% 0.012 255);
    --muted: oklch(44% 0.012 255);
    --border: oklch(87% 0.007 250);
    --accent: oklch(47% 0.12 215);
    --accent-ink: oklch(97% 0.01 215);
    --accent-tint: oklch(93% 0.03 215);
    --ok: oklch(52% 0.13 150);
    --warn: oklch(56% 0.16 45);
    --danger: oklch(52% 0.17 25);
    --danger-tint: oklch(94% 0.03 25);
    --wochenende-bg: oklch(32% 0.012 255);
    --wochenende-ink: oklch(95% 0.006 255);
    --shadow: 0 1px 2px oklch(23% 0.012 255 / 0.06), 0 6px 20px oklch(23% 0.012 255 / 0.07);
    --radius: 10px;
    --serif: 'Source Serif 4', Georgia, serif;
    --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: oklch(20% 0.009 255);
      --surface: oklch(24% 0.01 255);
      --surface-2: oklch(28% 0.011 255);
      --ink: oklch(94% 0.006 255);
      --muted: oklch(68% 0.012 255);
      --border: oklch(34% 0.012 255);
      --accent: oklch(72% 0.11 210);
      --accent-ink: oklch(16% 0.02 210);
      --accent-tint: oklch(30% 0.05 210);
      --ok: oklch(70% 0.14 150);
      --warn: oklch(74% 0.14 80);
      --danger: oklch(72% 0.15 25);
      --danger-tint: oklch(32% 0.07 25);
      --shadow: 0 1px 2px oklch(0% 0 0 / 0.3), 0 10px 30px oklch(0% 0 0 / 0.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: oklch(20% 0.009 255); --surface: oklch(24% 0.01 255); --surface-2: oklch(28% 0.011 255);
    --ink: oklch(94% 0.006 255); --muted: oklch(68% 0.012 255); --border: oklch(34% 0.012 255);
    --accent: oklch(72% 0.11 210); --accent-ink: oklch(16% 0.02 210); --accent-tint: oklch(30% 0.05 210);
    --ok: oklch(70% 0.14 150); --warn: oklch(74% 0.14 80); --danger: oklch(72% 0.15 25); --danger-tint: oklch(32% 0.07 25);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: var(--serif); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
  p { margin: 0; }
  button { font-family: var(--sans); }
  ::selection { background: var(--accent-tint); }

  @media (prefers-reduced-motion: no-preference) {
    .panel-enter { animation: fadeUp .38s cubic-bezier(.22,.9,.3,1) both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .tab-panel { animation: fade .22s ease both; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  }

  .shell { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
  @media (max-width: 860px) { .shell { grid-template-columns: 1fr; } }

  .sidebar {
    border-right: 1px solid var(--border); background: var(--surface); padding: 20px 16px;
    display: flex; flex-direction: column; gap: 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  @media (max-width: 860px) {
    .sidebar { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--border); flex-direction: row; align-items: center; overflow-x: auto; padding: 14px 16px; }
    .sidebar .brand { display: none; }
    .sidebar .klassen-liste { display: flex; flex-direction: row; gap: 8px; flex: 1; }
    .sidebar .neue-klasse-btn { flex: 0 0 auto; }
  }
  .brand { font-family: var(--serif); font-size: 1.3rem; font-weight: 700; padding: 0 4px; line-height: 1.15; }
  .brand .sj { display: block; font-family: var(--sans); font-size: 0.72rem; font-weight: 600; color: var(--muted); margin-top: 2px; }
  .brand span { color: var(--accent); }
  .klassen-liste { display: flex; flex-direction: column; gap: 3px; }
  .werkzeuge-liste { padding-bottom: 12px; margin-bottom: 4px; border-bottom: 1px solid var(--border); }
  @media (max-width: 860px) { .werkzeuge-liste { padding-bottom: 0; margin-bottom: 0; border-bottom: none; border-right: 1px solid var(--border); padding-right: 10px; margin-right: 2px; } }
  .klasse-item {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 12px; border-radius: 8px;
    cursor: pointer; border: 1px solid transparent; font-size: 0.92rem; font-weight: 500; white-space: nowrap;
  }
  .klasse-item:hover { background: var(--surface-2); }
  .klasse-item.aktiv { background: var(--accent-tint); color: var(--accent); border-color: var(--accent-tint); }
  .klasse-item .anzahl { color: var(--muted); font-size: 0.8rem; font-weight: 400; }
  .klasse-item.aktiv .anzahl { color: var(--accent); opacity: 0.75; }
  .neue-klasse-btn {
    margin-top: 4px; padding: 9px 12px; border-radius: 8px; border: 1.5px dashed var(--border); background: none;
    color: var(--muted); font-size: 0.88rem; cursor: pointer; text-align: left; font-weight: 500;
  }
  .neue-klasse-btn:hover { border-color: var(--accent); color: var(--accent); }
  .sidebar-footer { margin-top: auto; display: flex; flex-direction: column; gap: 4px; padding-top: 12px; border-top: 1px solid var(--border); }
  @media (max-width: 860px) { .sidebar-footer { display: none; } }
  .text-btn {
    background: none; border: none; color: var(--muted); font-size: 0.82rem; text-align: left; cursor: pointer; padding: 6px 4px;
    border-radius: 6px;
  }
  .text-btn:hover { color: var(--ink); background: var(--surface-2); }

  .main { padding: 28px 32px 64px; min-width: 0; }
  @media (max-width: 860px) { .main { padding: 20px 16px 48px; } }
  .main-inner { max-width: 1100px; margin: 0 auto; }

  .leer-zustand { text-align: center; padding: 80px 20px; color: var(--muted); }
  .leer-zustand h2 { color: var(--ink); margin-bottom: 8px; font-size: 1.4rem; }
  .leer-zustand p { max-width: 42ch; margin: 0 auto 20px; line-height: 1.55; }

  .klasse-kopf { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 4px; flex-wrap: wrap; }
  .klasse-kopf h1 { font-size: 2rem; }
  .klasse-kopf-aktionen { display: flex; gap: 8px; }
  .meta-zeile { color: var(--muted); font-size: 0.9rem; margin-bottom: 22px; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 8px; font-size: 0.88rem;
    font-weight: 600; cursor: pointer; border: 1.5px solid transparent; font-family: var(--sans);
    transition: transform .15s cubic-bezier(.22,.9,.3,1), background .15s, border-color .15s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { filter: brightness(1.07); }
  .btn-ghost { background: none; border-color: var(--border); color: var(--ink); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger-ghost { background: none; border-color: var(--border); color: var(--danger); }
  .btn-danger-ghost:hover { border-color: var(--danger); background: var(--danger-tint); }
  .btn-sm { padding: 6px 12px; font-size: 0.8rem; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .faecher-leiste { display: flex; gap: 6px; border-bottom: 1px solid var(--border); margin-bottom: 24px; flex-wrap: wrap; align-items: flex-end; }
  .fach-tab {
    padding: 10px 16px; border: none; background: none; cursor: pointer; font-size: 0.92rem; font-weight: 600;
    color: var(--muted); border-bottom: 2.5px solid transparent; margin-bottom: -1px; display: flex; flex-direction: column; gap: 2px;
  }
  .fach-tab .schnitt-badge { font-size: 0.72rem; font-weight: 500; color: var(--muted); }
  .fach-tab.aktiv { color: var(--ink); border-bottom-color: var(--accent); }
  .fach-tab.aktiv .schnitt-badge { color: var(--accent); }
  .fach-tab-neu { padding: 10px 14px; border: none; background: none; cursor: pointer; color: var(--muted); font-size: 1.1rem; margin-bottom: -1px; }
  .fach-tab-neu:hover { color: var(--accent); }

  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .toolbar-aktionen { display: flex; gap: 8px; flex-wrap: wrap; }

  .tabellen-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
  table.notentabelle { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
  table.notentabelle th, table.notentabelle td { padding: 9px 12px; text-align: center; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.notentabelle th:not(.schueler-col):not(.schnitt-col), table.notentabelle td:not(.schueler-col):not(.schnitt-col) { text-align: left; }
  table.notentabelle thead th { font-weight: 600; vertical-align: bottom; background: var(--surface); position: sticky; top: 0; z-index: 2; }
  table.notentabelle th.nr-col, table.notentabelle td.nr-col {
    text-align: center; position: sticky; left: 0; background: var(--surface); z-index: 3; color: var(--muted);
    font-weight: 500; width: 36px; min-width: 36px;
  }
  table.notentabelle th.schueler-col, table.notentabelle td.schueler-col {
    text-align: left; position: sticky; left: 36px; background: var(--surface); z-index: 3; border-right: 1px solid var(--border); font-weight: 500;
    min-width: 160px;
  }
  .schueler-klickbar { cursor: pointer; }
  .schueler-klickbar:hover { color: var(--accent); text-decoration: underline; }
  table.notentabelle thead th.schueler-col, table.notentabelle thead th.nr-col { z-index: 4; }
  table.notentabelle tbody tr:hover td { background: var(--surface-2); }
  table.notentabelle tbody tr:hover td.schueler-col, table.notentabelle tbody tr:hover td.nr-col { background: var(--surface-2); }
  table.notentabelle td.schnitt-col, table.notentabelle th.schnitt-col { font-weight: 700; background: var(--accent-tint); color: var(--accent); }
  table.notentabelle th.entfernen-col, table.notentabelle td.entfernen-col { width: 32px; padding: 9px 6px; }
  .schueler-entfernen-btn {
    background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.78rem; padding: 3px 6px; border-radius: 5px;
    opacity: 0; transition: opacity .12s;
  }
  table.notentabelle tbody tr:hover .schueler-entfernen-btn { opacity: 1; }
  .schueler-entfernen-btn:hover { color: var(--danger); background: var(--danger-tint); }
  table.notentabelle tfoot td { font-weight: 700; background: var(--surface-2); border-top: 2px solid var(--border); border-bottom: none; }
  .lnw-head { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; min-width: 110px; max-width: 160px; }
  .lnw-head .nr { color: var(--muted); font-weight: 600; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.03em; }
  .lnw-head .typ { font-weight: 700; font-size: 0.88rem; }
  .lnw-head .thema { color: var(--muted); font-weight: 500; font-size: 0.78rem; max-width: 150px; white-space: normal; }
  .lnw-head .zusatz { color: var(--muted); font-weight: 400; font-size: 0.74rem; white-space: normal; }
  .lnw-head-aktionen { display: flex; gap: 2px; margin-top: 3px; padding-top: 5px; border-top: 1px solid var(--border); width: 100%; }
  .lnw-head-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.72rem; padding: 2px 6px; border-radius: 5px; }
  .lnw-head-btn:hover { color: var(--accent); background: var(--accent-tint); }
  .lnw-head-btn[data-lnw-loeschen]:hover { color: var(--danger); background: var(--danger-tint); }

  select.noten-select {
    width: 62px; padding: 5px 2px; border-radius: 6px; border: 1.5px solid var(--border); background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 0.86rem; text-align: center; cursor: pointer;
  }
  select.noten-select:focus { outline: none; border-color: var(--accent); }
  .note-gesperrt {
    display: inline-block; width: 62px; padding: 5px 2px; text-align: center; font-size: 0.86rem; font-weight: 600;
    color: var(--ink);
  }

  .leeres-fach { padding: 48px 20px; text-align: center; color: var(--muted); }
  .leeres-fach p { max-width: 40ch; margin: 0 auto 16px; line-height: 1.55; }

  dialog { border: none; border-radius: 14px; padding: 0; background: var(--bg); color: var(--ink); box-shadow: var(--shadow); max-width: 480px; width: 92vw; }
  dialog::backdrop { background: oklch(10% 0 0 / 0.42); backdrop-filter: blur(2px); }
  .dialog-inner { padding: 24px; }
  .dialog-inner h2 { font-size: 1.25rem; margin-bottom: 18px; }
  .feld { margin-bottom: 14px; }
  .feld label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
  .feld input[type="text"], .feld input[type="number"], .feld input[type="date"], .feld select, .feld textarea {
    width: 100%; padding: 9px 11px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--surface);
    color: var(--ink); font-family: var(--sans); font-size: 0.92rem;
  }
  .feld textarea { min-height: 90px; resize: vertical; font-family: var(--sans); }
  .feld input:focus, .feld select:focus, .feld textarea:focus { outline: none; border-color: var(--accent); }
  .gewicht-picks { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .gewicht-pick {
    padding: 6px 12px; border-radius: 999px; border: 1.5px solid var(--border); background: none; color: var(--ink);
    font-size: 0.82rem; cursor: pointer; font-weight: 600;
  }
  .gewicht-pick.aktiv { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .dialog-aktionen { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

  .ueberblick-inhalt { max-height: 60vh; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
  .ueberblick-fach h3 { display: flex; justify-content: space-between; align-items: baseline; font-size: 1rem; margin-bottom: 8px; }
  .schnitt-badge-dialog { font-family: var(--sans); font-size: 0.82rem; font-weight: 600; color: var(--accent); }
  .ueberblick-zeile { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; font-size: 0.86rem; border-bottom: 1px solid var(--border); }
  .ueberblick-zeile .note-wert { font-weight: 700; flex: 0 0 auto; }
  .typen-liste { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; max-height: 260px; overflow-y: auto; }
  .typen-zeile { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; }
  .typen-zeile .name { flex: 1; font-weight: 500; font-size: 0.9rem; }
  .typen-zeile .gewicht { color: var(--muted); font-size: 0.82rem; font-variant-numeric: tabular-nums; }
  .typen-zeile button { background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px 6px; border-radius: 6px; font-size: 0.8rem; }
  .typen-zeile button:hover { color: var(--danger); background: var(--danger-tint); }

  .schueler-liste-edit { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; max-height: 320px; overflow-y: auto; }
  .schueler-zeile-edit { display: flex; gap: 8px; align-items: center; }
  .schueler-zeile-edit input { flex: 1; }
  .schueler-zeile-edit button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.85rem; padding: 6px; }
  .schueler-zeile-edit button:hover { color: var(--danger); }

  .fuss-leiste { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border); }

  .kalender-kopf { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .kalender-kopf h1 { font-size: 1.5rem; flex: 1; }
  .kalender-grid-wrap { overflow-x: auto; }
  .kalender-grid { display: grid; grid-template-columns: repeat(7, minmax(110px, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; min-width: 100%; width: max-content; }
  @media (max-width: 860px) { .kalender-grid { width: 770px; } }
  .kalender-wochentag { background: var(--surface); padding: 8px 6px; font-size: 0.76rem; font-weight: 600; color: var(--muted); text-align: center; }
  .kalender-tag { background: var(--bg); min-height: 92px; padding: 6px; display: flex; flex-direction: column; gap: 4px; position: relative; }
  .kalender-tag.leer { background: var(--surface); }
  .kalender-tag.ferien { background: var(--surface-2); }
  .kalender-tag.wochenende { background: var(--wochenende-bg); }
  .kalender-tag.wochenende.ferien { background: color-mix(in oklch, var(--wochenende-bg), black 15%); }
  .kalender-tag.leer.wochenende { background: color-mix(in oklch, var(--wochenende-bg), var(--surface) 40%); }
  .kalender-tag.wochenende .tagnummer, .kalender-tag.wochenende .ferien-label { color: var(--wochenende-ink); }
  .kalender-tag.heute .tagnummer { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 6px; }
  .tagnummer { font-size: 0.78rem; font-weight: 600; align-self: flex-start; }
  .ferien-label { font-size: 0.64rem; color: var(--muted); line-height: 1.2; }
  .kalender-woche-info {
    grid-column: 1 / -1; background: var(--surface); padding: 5px 12px; font-size: 0.74rem; font-weight: 600;
    color: var(--muted); text-align: right;
  }
  .termin-chip {
    font-family: var(--sans); font-size: 0.66rem; line-height: 1.25; text-align: left; background: var(--accent-tint); color: var(--accent);
    border: none; border-radius: 6px; padding: 3px 5px; cursor: pointer; font-weight: 600;
  }
  .termin-chip:hover { filter: brightness(0.95); }
  .tag-plus {
    position: absolute; top: 4px; right: 4px; width: 18px; height: 18px; border-radius: 5px; border: none; background: none;
    color: var(--muted); cursor: pointer; font-size: 0.8rem; opacity: 0; transition: opacity .15s;
  }
  .kalender-tag:hover .tag-plus { opacity: 1; }
  .tag-plus:hover { background: var(--accent-tint); color: var(--accent); }
  .kalender-hinweis { margin-top: 14px; font-size: 0.82rem; color: var(--muted); }

  .jahr-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
  .mini-monat {
    text-align: left; border: 1.5px solid var(--border); border-radius: var(--radius); background: var(--surface);
    padding: 12px; cursor: pointer; font-family: var(--sans); transition: border-color .15s;
  }
  .mini-monat:hover { border-color: var(--accent); }
  .mini-monat h3 { font-family: var(--serif); font-size: 0.94rem; margin-bottom: 8px; }
  .mini-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; font-size: 0.64rem; }
  .mini-wd { text-align: center; color: var(--muted); font-weight: 600; padding-bottom: 3px; }
  .mini-tag { text-align: center; padding: 2px 0; border-radius: 3px; position: relative; color: var(--ink); }
  .mini-tag.ferien { background: var(--surface-2); }
  .mini-tag.wochenende { background: var(--wochenende-bg); color: var(--wochenende-ink); }
  .mini-tag.wochenende.ferien { background: color-mix(in oklch, var(--wochenende-bg), black 15%); }
  .mini-tag.heute { outline: 1.5px solid var(--accent); outline-offset: -1px; font-weight: 700; }
  .mini-tag.hat-termin::after {
    content: ""; position: absolute; bottom: 1px; left: 50%; transform: translateX(-50%);
    width: 3px; height: 3px; border-radius: 50%; background: var(--accent);
  }
  .mini-tag.wochenende.hat-termin::after { background: var(--wochenende-ink); }

  .stundenplan-vorschau { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--surface); max-width: 720px; }
  .stundenplan-vorschau img { width: 100%; display: block; }
  .stundenplan-vorschau embed { width: 100%; height: 70vh; display: block; }
  .stundenplan-vorschau p { padding: 10px 14px; font-size: 0.86rem; }

  .nur-druck { display: none; }
  #druck-lnw { display: none; }
  @media print {
    .sidebar, .toolbar-aktionen, .fach-tab-neu, .lnw-head-btn, .fuss-leiste, .klasse-kopf-aktionen, .druck-ausblenden { display: none !important; }
    .nur-druck { display: block; margin-bottom: 16px; font-size: 1.3rem; }
    .shell { display: block; }
    .main { padding: 0; }
    body { background: #fff; color: #000; }
    table.notentabelle th.schueler-col, table.notentabelle td.schueler-col, table.notentabelle th.nr-col, table.notentabelle td.nr-col { position: static; }
    table.notentabelle thead th { position: static; }
    .tabellen-wrap { border: none; }
    select.noten-select { border: none; appearance: none; background: none; }
    @page { size: landscape; margin: 14mm; }
    body.druck-einzeln .shell { display: none !important; }
    body.druck-einzeln #druck-lnw { display: block; }
    body.druck-einzeln .druck-lnw-seite { display: block; }
  }

  .druck-lnw-seite { display: none; font-family: var(--sans); color: #000; background: #fff; }
  .druck-lnw-seite h1 { font-family: var(--serif); font-size: 1.3rem; margin-bottom: 2px; }
  .druck-lnw-seite h2 { font-family: var(--serif); font-size: 1.05rem; font-weight: 600; margin: 0 0 2px; }
  .druck-lnw-meta { font-size: 0.82rem; color: #333; margin-bottom: 18px; }
  .druck-diagramm {
    display: flex; align-items: flex-end; gap: 10px; border-bottom: 1.5px solid #333;
    margin-bottom: 22px; padding: 0 8px;
  }
  .druck-balken-saeule { flex: 1; display: flex; flex-direction: column; align-items: center; }
  .druck-balken-zahl { font-size: 0.72rem; margin-bottom: 3px; }
  .druck-balken-spur { height: 100px; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
  .druck-balken {
    width: 55%; min-height: 2px; background: #333; border: 1.5px solid #000;
    -webkit-print-color-adjust: exact; print-color-adjust: exact; color-adjust: exact;
  }
  .druck-balken-label { font-size: 0.8rem; margin-top: 4px; font-weight: 700; }
  .druck-schueler-titel { font-size: 0.82rem; font-weight: 700; margin-bottom: 6px; }
  .druck-schuelerliste-spalten { display: flex; gap: 26px; align-items: flex-start; }
  .druck-schuelerliste { flex: 1; font-size: 0.84rem; min-width: 0; }
  .druck-schueler-zeile {
    display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; border-bottom: 1px solid #ccc; break-inside: avoid;
  }
  .druck-schueler-zeile span:last-child { font-weight: 700; }
  .druck-unterschrift { margin-top: 60px; max-width: 280px; }
  .druck-unterschrift { border-top: 1px solid #000; padding-top: 4px; }
  .druck-unterschrift span { font-size: 0.78rem; color: #333; }
</style>
</head>
<body>
<div id="app"></div>
<div id="druck-lnw"></div>
<script>
(function () {
  "use strict";

  var SPEICHER_KEY = "notenbuch-v1";

  var NOTEN_OPTIONEN = ["1+","1","1-","2+","2","2-","3+","3","3-","4+","4","4-","5+","5","5-","6","n.a."];
  var NOTEN_ZAHL = {};
  NOTEN_OPTIONEN.forEach(function (label) {
    if (label === "n.a.") { NOTEN_ZAHL[label] = 6; return; }
    var basis = parseInt(label[0], 10);
    var tendenz = label.length > 1 ? label[1] : null;
    var zahl = basis;
    if (tendenz === "+") zahl = basis - 1 / 3;
    if (tendenz === "-") zahl = basis + 1 / 3;
    NOTEN_ZAHL[label] = zahl;
  });

  var GEWICHT_PRESETS = [
    { label: "⅓", wert: 1 / 3 },
    { label: "½", wert: 0.5 },
    { label: "1", wert: 1 },
    { label: "2", wert: 2 }
  ];

  var STANDARD_LNW_TYPEN = [
    { name: "Großer LNW", gewicht: 2 },
    { name: "Kleiner LNW", gewicht: 1 },
    { name: "Mündliche Beiträge", gewicht: 1 },
    { name: "Vokabeltest", gewicht: 1 / 3 },
    { name: "Referat", gewicht: 1 },
    { name: "Gruppenarbeit", gewicht: 1 },
    { name: "Präsentation", gewicht: 1 },
    { name: "Vortrag", gewicht: 1 },
    { name: "Kunstwerk", gewicht: 1 },
    { name: "Lapbook", gewicht: 1 },
    { name: "Plakat", gewicht: 1 }
  ];

  // Offizielle Ferientermine Bayern, Quelle: km.bayern.de/termine/ferien-und-feiertage,
  // Bekanntmachung BayMBl. 2022 Nr. 747 (Schuljahre 2024/25 bis 2029/30). Stand der Erfassung: 11/2026,
  // hier eingetragen bis einschließlich Sommerferien 2027. Weitere Schuljahre bei Bedarf ergänzen.
  var BAYERN_FERIEN = [
    { name: "Sommerferien 2026", start: "2026-08-03", ende: "2026-09-14" },
    { name: "Allerheiligen-Ferien 2026", start: "2026-11-02", ende: "2026-11-06" },
    { name: "Weihnachtsferien 2026/27", start: "2026-12-24", ende: "2027-01-08" },
    { name: "Frühjahrsferien 2027", start: "2027-02-08", ende: "2027-02-12" },
    { name: "Osterferien 2027", start: "2027-03-22", ende: "2027-04-02" },
    { name: "Pfingstferien 2027", start: "2027-05-18", ende: "2027-05-28" },
    { name: "Sommerferien 2027", start: "2027-08-02", ende: "2027-09-13" }
  ];

  function ferienAmTag(iso) {
    return BAYERN_FERIEN.filter(function (f) { return iso >= f.start && iso <= f.ende; })[0] || null;
  }

  function neueId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  function heuteIso() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function ladeZustand() {
    try {
      var roh = localStorage.getItem(SPEICHER_KEY);
      if (roh) return JSON.parse(roh);
    } catch (e) {}
    return { klassen: [], stundenplan: null };
  }

  function speichereZustand() {
    try { localStorage.setItem(SPEICHER_KEY, JSON.stringify(zustand)); return true; } catch (e) { return false; }
  }

  var zustand = ladeZustand();
  var heute = new Date();
  var ui = { klasseId: null, fachId: null, ansicht: "klasse", kalenderJahr: heute.getFullYear(), kalenderMonat: heute.getMonth(), kalenderModus: "monat" };

  function findeKlasse(id) {
    for (var i = 0; i < zustand.klassen.length; i++) { if (zustand.klassen[i].id === id) return zustand.klassen[i]; }
    return null;
  }
  function findeFach(klasse, id) {
    if (!klasse) return null;
    for (var i = 0; i < klasse.faecher.length; i++) { if (klasse.faecher[i].id === id) return klasse.faecher[i]; }
    return null;
  }

  function sichtbareSchueler(klasse, fach) {
    var ausgeschlossen = fach.ausgeschlosseneSchueler || [];
    return klasse.schueler.filter(function (s) { return ausgeschlossen.indexOf(s.id) === -1; });
  }

  function formatSchnitt(wert) {
    if (wert == null) return "–";
    return wert.toLocaleString("de-DE", { minimumFractionDigits: 1, maximumFractionDigits: 2 });
  }

  function formatGewicht(gewicht) {
    var treffer = GEWICHT_PRESETS.filter(function (p) { return Math.abs(p.wert - gewicht) < 0.001; })[0];
    if (treffer) return treffer.label + "×";
    return (Math.round(gewicht * 100) / 100) + "×";
  }

  function schuelerSchnitt(fach, schuelerId) {
    var summeProdukt = 0, summeGewicht = 0;
    fach.lnws.forEach(function (lnw) {
      var wert = lnw.noten[schuelerId];
      if (wert == null || wert === "") return;
      summeProdukt += NOTEN_ZAHL[wert] * lnw.gewicht;
      summeGewicht += lnw.gewicht;
    });
    if (summeGewicht === 0) return null;
    return summeProdukt / summeGewicht;
  }

  function lnwSchnitt(lnw, schuelerListe) {
    var summe = 0, anzahl = 0;
    schuelerListe.forEach(function (s) {
      var wert = lnw.noten[s.id];
      if (wert == null || wert === "") return;
      summe += NOTEN_ZAHL[wert]; anzahl++;
    });
    if (anzahl === 0) return null;
    return summe / anzahl;
  }

  function klassenDurchschnittFach(klasse, fach) {
    var summe = 0, anzahl = 0;
    sichtbareSchueler(klasse, fach).forEach(function (s) {
      var sc = schuelerSchnitt(fach, s.id);
      if (sc == null) return;
      summe += sc; anzahl++;
    });
    if (anzahl === 0) return null;
    return summe / anzahl;
  }

  function alleLnwsMitKontext() {
    var liste = [];
    zustand.klassen.forEach(function (k) {
      k.faecher.forEach(function (f) {
        f.lnws.forEach(function (lnw) {
          if (!lnw.datum) return;
          var typ = f.lnwTypen.filter(function (t) { return t.id === lnw.typId; })[0];
          liste.push({ klasse: k, fach: f, lnw: lnw, typName: typ ? typ.name : "?" });
        });
      });
    });
    return liste;
  }

  var app = document.getElementById("app");

  function render() {
    var klasse = findeKlasse(ui.klasseId);
    var html = '<div class="shell">' + renderSidebar(klasse) + '<main class="main"><div class="main-inner panel-enter">';
    if (ui.ansicht === "kalender") {
      html += renderKalender();
    } else if (ui.ansicht === "stundenplan") {
      html += renderStundenplan();
    } else if (!klasse) {
      html += renderLeerZustand();
    } else {
      var fach = findeFach(klasse, ui.fachId);
      html += renderKlasse(klasse, fach);
    }
    html += '<div class="fuss-leiste druck-ausblenden">' +
      '<button class="text-btn" id="export-btn">Sicherung herunterladen</button>' +
      '<button class="text-btn" id="import-btn">Sicherung einspielen</button>' +
      '<input type="file" id="import-datei" accept="application/json" hidden>' +
      '</div>';
    html += '</div></main></div>';
    app.innerHTML = html;
    bindeEvents(klasse);
  }

  function renderSidebar(klasseAktiv) {
    var liste = zustand.klassen.map(function (k) {
      var aktiv = ui.ansicht === "klasse" && klasseAktiv && k.id === klasseAktiv.id;
      return '<div class="klasse-item' + (aktiv ? ' aktiv' : '') + '" data-klasse-id="' + k.id + '">' +
        '<span>' + escapeHtml(k.name) + '</span><span class="anzahl">' + k.schueler.length + '</span></div>';
    }).join("");
    var werkzeuge = ["kalender", "stundenplan"].map(function (a) {
      var label = a === "kalender" ? "Kalender" : "Stundenplan";
      return '<div class="klasse-item' + (ui.ansicht === a ? ' aktiv' : '') + '" data-ansicht="' + a + '">' +
        '<span>' + label + '</span></div>';
    }).join("");
    return '<nav class="sidebar">' +
      '<div class="brand">Noten<span>buch</span><span class="sj">SJ 26/27</span></div>' +
      '<div class="klassen-liste werkzeuge-liste">' + werkzeuge + '</div>' +
      '<div class="klassen-liste">' + liste + '</div>' +
      '<button class="neue-klasse-btn" id="neue-klasse-btn">+ Neue Klasse</button>' +
      '<div class="sidebar-footer"></div>' +
      '</nav>';
  }

  function renderLeerZustand() {
    if (zustand.klassen.length === 0) {
      return '<div class="leer-zustand"><h2>Noch keine Klasse angelegt</h2>' +
        '<p>Leg deine erste Klasse an, trag die Namen deiner Schüler ein und verteil die Fächer, die du dort unterrichtest.</p>' +
        '<button class="btn btn-primary" id="leer-neue-klasse-btn">+ Neue Klasse anlegen</button></div>';
    }
    return '<div class="leer-zustand"><h2>Wähle eine Klasse</h2><p>Wähle links eine Klasse aus, oder leg eine neue an.</p></div>';
  }

  var MONATSNAMEN = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
  var WOCHENTAGE = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];

  function datumZuIso(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function tageDiff(isoVon, isoBis) {
    var a = new Date(isoVon + "T00:00:00"), b = new Date(isoBis + "T00:00:00");
    return Math.round((b - a) / 86400000);
  }

  function naechsteFerienInfo(iso) {
    var aktuell = ferienAmTag(iso);
    if (aktuell) {
      var tageBisEnde = tageDiff(iso, aktuell.ende);
      if (tageBisEnde <= 0) return null;
      return aktuell.name + " – noch " + tageBisEnde + (tageBisEnde === 1 ? " Tag" : " Tage");
    }
    var kommende = BAYERN_FERIEN.filter(function (f) { return f.start > iso; }).sort(function (a, b) { return a.start < b.start ? -1 : 1; })[0];
    if (!kommende) return null;
    var tage = tageDiff(iso, kommende.start);
    return "noch " + tage + (tage === 1 ? " Tag" : " Tage") + " bis " + kommende.name;
  }

  function schuljahrStart(jahr, monat) {
    return monat < 8 ? jahr - 1 : jahr; // Schuljahr beginnt im September (Index 8)
  }

  function renderJahresuebersicht() {
    var startJahr = schuljahrStart(ui.kalenderJahr, ui.kalenderMonat);
    var alleLnws = alleLnwsMitKontext();
    var monate = [];
    for (var i = 0; i < 12; i++) {
      monate.push({ jahr: startJahr + Math.floor((8 + i) / 12), monat: (8 + i) % 12 });
    }

    var html = '<div class="kalender-kopf druck-ausblenden">' +
      '<button class="btn btn-ghost btn-sm" id="schuljahr-zurueck">←</button>' +
      '<h1>Schuljahr ' + startJahr + '/' + (startJahr + 1) + '</h1>' +
      '<button class="btn btn-ghost btn-sm" id="schuljahr-vor">→</button>' +
      '<button class="btn btn-ghost btn-sm" id="monatsansicht-btn">Monatsansicht</button>' +
      '</div>';

    html += '<div class="jahr-grid">';
    monate.forEach(function (mo) { html += renderMiniMonat(mo.jahr, mo.monat, alleLnws); });
    html += '</div>';
    html += '<p class="kalender-hinweis druck-ausblenden">Auf einen Monat klicken, um ihn im Detail zu öffnen.</p>';
    return html;
  }

  function renderMiniMonat(jahr, monat, alleLnws) {
    var ersterTag = new Date(jahr, monat, 1);
    var anzahlTage = new Date(jahr, monat + 1, 0).getDate();
    var startOffset = (ersterTag.getDay() + 6) % 7;
    var html = '<button class="mini-monat" data-mini-jahr="' + jahr + '" data-mini-monat="' + monat + '">' +
      '<h3>' + MONATSNAMEN[monat] + ' ' + jahr + '</h3><div class="mini-grid">';
    WOCHENTAGE.forEach(function (w) { html += '<span class="mini-wd">' + w.charAt(0) + '</span>'; });
    for (var i = 0; i < startOffset; i++) html += '<span class="mini-tag leer"></span>';
    for (var tag = 1; tag <= anzahlTage; tag++) {
      var iso = jahr + "-" + String(monat + 1).padStart(2, "0") + "-" + String(tag).padStart(2, "0");
      var ferien = ferienAmTag(iso);
      var wIdx = (startOffset + tag - 1) % 7;
      var we = wIdx === 5 || wIdx === 6;
      var hatTermin = alleLnws.some(function (e) { return e.lnw.datum === iso; });
      var istHeute = iso === heuteIso();
      html += '<span class="mini-tag' + (ferien ? ' ferien' : '') + (we ? ' wochenende' : '') + (hatTermin ? ' hat-termin' : '') + (istHeute ? ' heute' : '') + '">' + tag + '</span>';
    }
    html += '</div></button>';
    return html;
  }

  function renderKalender() {
    if (ui.kalenderModus === "jahr") return renderJahresuebersicht();

    var jahr = ui.kalenderJahr, monat = ui.kalenderMonat;
    var ersterTag = new Date(jahr, monat, 1);
    var anzahlTage = new Date(jahr, monat + 1, 0).getDate();
    var startOffset = (ersterTag.getDay() + 6) % 7; // Montag = 0
    var alleLnws = alleLnwsMitKontext();

    var html = '<div class="kalender-kopf druck-ausblenden">' +
      '<button class="btn btn-ghost btn-sm" id="monat-zurueck">←</button>' +
      '<h1>' + MONATSNAMEN[monat] + " " + jahr + '</h1>' +
      '<button class="btn btn-ghost btn-sm" id="monat-vor">→</button>' +
      '<button class="btn btn-ghost btn-sm" id="monat-heute">Heute</button>' +
      '<button class="btn btn-ghost btn-sm" id="jahresuebersicht-btn">Gesamtübersicht Schuljahr</button>' +
      '</div>';

    html += '<div class="kalender-grid-wrap"><div class="kalender-grid">';
    WOCHENTAGE.forEach(function (w) { html += '<div class="kalender-wochentag">' + w + '</div>'; });

    var gridStart = new Date(jahr, monat, 1 - startOffset);
    var gridEndeExklusiv = new Date(jahr, monat, anzahlTage + 1);
    var restTage = (7 - (((gridEndeExklusiv - gridStart) / 86400000) % 7)) % 7;
    var gesamtZellen = Math.round((gridEndeExklusiv - gridStart) / 86400000) + restTage;

    for (var i = 0; i < gesamtZellen; i++) {
      var datum = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
      var iso = datumZuIso(datum);
      var imMonat = datum.getMonth() === monat;
      var wochentagIdx = i % 7; // 0 = Montag ... 5 = Samstag, 6 = Sonntag
      var istWochenende = wochentagIdx === 5 || wochentagIdx === 6;

      if (!imMonat) {
        html += '<div class="kalender-tag leer' + (istWochenende ? ' wochenende' : '') + '"></div>';
      } else {
        var ferien = ferienAmTag(iso);
        var istHeute = iso === heuteIso();
        var termine = alleLnws.filter(function (e) { return e.lnw.datum === iso; });
        html += '<div class="kalender-tag' + (ferien ? ' ferien' : '') + (istHeute ? ' heute' : '') + (istWochenende ? ' wochenende' : '') + '" data-tag="' + iso + '">' +
          '<span class="tagnummer">' + datum.getDate() + '</span>' +
          (ferien ? '<span class="ferien-label">' + escapeHtml(ferien.name) + '</span>' : '') +
          termine.map(function (e) {
            return '<button class="termin-chip" data-termin-klasse="' + e.klasse.id + '" data-termin-fach="' + e.fach.id + '">' +
              escapeHtml(e.klasse.name) + ' · ' + escapeHtml(e.fach.name) + '<br>' + escapeHtml(e.typName) + '</button>';
          }).join("") +
          '<button class="tag-plus druck-ausblenden" data-tag-plus="' + iso + '" title="Leistungsnachweis planen">+</button>' +
          '</div>';
      }

      if (wochentagIdx === 6) {
        var montagDatum = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i - 6);
        var info = naechsteFerienInfo(datumZuIso(montagDatum));
        html += '<div class="kalender-woche-info">' + (info ? escapeHtml(info) : "") + '</div>';
      }
    }
    html += '</div></div>';
    html += '<p class="kalender-hinweis druck-ausblenden">Bayerische Schulferien grau hinterlegt, Samstag/Sonntag dunkelgrau. Am Ende jeder Woche steht, wie viele Tage noch bis zu den nächsten Ferien sind. Auf ein Datum klicken, um einen Leistungsnachweis zu planen, oder auf einen vorhandenen Termin, um direkt zu den Noten zu springen.</p>';
    return html;
  }

  function renderStundenplan() {
    var html = '<h1>Stundenplan</h1><p class="meta-zeile">Nur auf diesem Gerät gespeichert.</p>';
    if (zustand.stundenplan) {
      var sp = zustand.stundenplan;
      html += '<div class="stundenplan-vorschau">';
      if (sp.typ.indexOf("image/") === 0) {
        html += '<img src="' + sp.dataUrl + '" alt="Stundenplan">';
      } else {
        html += '<embed src="' + sp.dataUrl + '" type="application/pdf">' +
          '<p><a href="' + sp.dataUrl + '" target="_blank" rel="noopener">In neuem Tab öffnen</a></p>';
      }
      html += '</div>' +
        '<div class="toolbar-aktionen druck-ausblenden" style="margin-top:16px;">' +
        '<button class="btn btn-ghost btn-sm" id="stundenplan-ersetzen-btn">Ersetzen</button>' +
        '<button class="btn btn-danger-ghost btn-sm" id="stundenplan-entfernen-btn">Entfernen</button>' +
        '<input type="file" id="stundenplan-datei" accept="image/*,application/pdf" hidden>' +
        '</div>';
    } else {
      html += '<div class="leeres-fach druck-ausblenden"><p>Lade ein Foto oder PDF deines Stundenplans hoch, um ihn hier jederzeit griffbereit zu haben.</p>' +
        '<button class="btn btn-primary" id="stundenplan-hochladen-btn">Stundenplan hochladen</button>' +
        '<input type="file" id="stundenplan-datei" accept="image/*,application/pdf" hidden></div>';
    }
    return html;
  }

  function renderKlasse(klasse, fach) {
    var html = '<div class="klasse-kopf"><h1>' + escapeHtml(klasse.name) + '</h1>' +
      '<div class="klasse-kopf-aktionen druck-ausblenden">' +
      '<button class="btn btn-ghost btn-sm" id="schueler-verwalten-btn">Schüler verwalten</button>' +
      '<button class="btn btn-ghost btn-sm" id="klasse-umbenennen-btn">Umbenennen</button>' +
      '<button class="btn btn-danger-ghost btn-sm" id="klasse-loeschen-btn">Löschen</button>' +
      '</div></div>' +
      '<p class="meta-zeile">' + klasse.schueler.length + ' Schüler' + (klasse.schueler.length === 1 ? '' : (klasse.schueler.length === 0 ? 'e' : '')) + (klasse.schueler.length !== 1 ? 'innen und Schüler' : '') + '</p>';

    html += '<div class="faecher-leiste druck-ausblenden">';
    klasse.faecher.forEach(function (f) {
      var schnitt = klassenDurchschnittFach(klasse, f);
      var aktiv = fach && f.id === fach.id;
      html += '<button class="fach-tab' + (aktiv ? ' aktiv' : '') + '" data-fach-id="' + f.id + '">' +
        '<span>' + escapeHtml(f.name) + '</span>' +
        '<span class="schnitt-badge">Ø ' + formatSchnitt(schnitt) + '</span></button>';
    });
    html += '<button class="fach-tab-neu" id="neues-fach-btn" title="Neues Fach">+</button></div>';

    if (!fach) {
      if (klasse.faecher.length === 0) {
        html += '<div class="leeres-fach"><p>Diese Klasse hat noch kein Fach. Leg ein Fach an, um Leistungsnachweise und Noten zu erfassen.</p>' +
          '<button class="btn btn-primary" id="leeres-fach-neu-btn">+ Fach anlegen</button></div>';
      }
      return html;
    }

    html += '<div class="tab-panel">';
    html += '<h2 class="nur-druck">' + escapeHtml(fach.name) + '</h2>';
    html += '<div class="toolbar druck-ausblenden"><div class="toolbar-aktionen">' +
      '<button class="btn btn-primary btn-sm" id="neuer-lnw-btn"' + (klasse.schueler.length === 0 ? ' disabled' : '') + '>+ Neuer Leistungsnachweis</button>' +
      (fach.notenEntsperrt
        ? '<button class="btn btn-primary btn-sm" id="noten-sperren-btn">Fertig</button>'
        : '<button class="btn btn-ghost btn-sm" id="noten-bearbeiten-btn">Noten bearbeiten</button>') +
      '<button class="btn btn-ghost btn-sm" id="typen-verwalten-btn">LNW-Typen verwalten</button>' +
      '<button class="btn btn-ghost btn-sm" id="fach-umbenennen-btn">Fach umbenennen</button>' +
      '<button class="btn btn-danger-ghost btn-sm" id="fach-loeschen-btn">Fach löschen</button>' +
      '</div><button class="btn btn-ghost btn-sm" id="drucken-btn">Drucken</button></div>';

    if (klasse.schueler.length === 0) {
      html += '<div class="leeres-fach"><p>Trag zuerst Schüler in dieser Klasse ein, bevor du Noten erfassen kannst.</p>' +
        '<button class="btn btn-primary" id="leeres-fach-schueler-btn">Schüler eintragen</button></div>';
    } else if (fach.lnws.length === 0) {
      html += '<div class="leeres-fach"><p>Noch kein Leistungsnachweis in ' + escapeHtml(fach.name) + '. Leg den ersten an.</p>' +
        '<button class="btn btn-primary" id="leeres-fach-lnw-btn">+ Neuer Leistungsnachweis</button></div>';
    } else {
      html += renderNotentabelle(klasse, fach);
    }
    html += '</div>';
    return html;
  }

  function renderNotentabelle(klasse, fach) {
    var schueler = sichtbareSchueler(klasse, fach);
    var ausgeschlosseneAnzahl = (fach.ausgeschlosseneSchueler || []).length;

    var html = '<div class="tabellen-wrap"><table class="notentabelle"><thead><tr><th class="nr-col">Nr.</th><th class="schueler-col">Schüler</th>';
    fach.lnws.forEach(function (lnw, i) {
      var typ = fach.lnwTypen.filter(function (t) { return t.id === lnw.typId; })[0];
      var typName = typ ? typ.name : "?";
      html += '<th><div class="lnw-head">' +
        '<span class="nr">' + (i + 1) + '. LNW</span>' +
        '<span class="typ">' + escapeHtml(typName) + '</span>' +
        (lnw.titel ? '<span class="thema">„' + escapeHtml(lnw.titel) + '“</span>' : '') +
        '<span class="zusatz">' + (lnw.datum ? formatDatumLang(lnw.datum) : 'kein Datum') + '</span>' +
        '<div class="lnw-head-aktionen druck-ausblenden">' +
        '<button class="lnw-head-btn" data-lnw-drucken="' + lnw.id + '">Drucken</button>' +
        '<button class="lnw-head-btn" data-lnw-loeschen="' + lnw.id + '">Löschen</button>' +
        '</div></div></th>';
    });
    html += '<th class="schnitt-col">Schnitt</th><th class="entfernen-col druck-ausblenden"></th></tr></thead><tbody>';

    schueler.forEach(function (s, idx) {
      html += '<tr><td class="nr-col">' + (idx + 1) + '</td>' +
        '<td class="schueler-col schueler-klickbar" data-schueler-uebersicht="' + s.id + '">' + escapeHtml(s.name) + '</td>';
      fach.lnws.forEach(function (lnw) {
        var wert = lnw.noten[s.id] || "";
        if (wert && !fach.notenEntsperrt) {
          html += '<td><span class="note-gesperrt">' + escapeHtml(wert) + '</span></td>';
        } else {
          html += '<td><select class="noten-select" data-lnw-id="' + lnw.id + '" data-schueler-id="' + s.id + '">' +
            '<option value=""' + (wert === "" ? " selected" : "") + '>–</option>' +
            NOTEN_OPTIONEN.map(function (n) { return '<option value="' + n + '"' + (wert === n ? " selected" : "") + '>' + n + '</option>'; }).join("") +
            '</select></td>';
        }
      });
      var schnitt = schuelerSchnitt(fach, s.id);
      html += '<td class="schnitt-col">' + formatSchnitt(schnitt) + '</td>' +
        '<td class="entfernen-col druck-ausblenden"><button class="schueler-entfernen-btn" data-schueler-entfernen="' + s.id + '" title="Aus diesem Fach entfernen">✕</button></td></tr>';
    });

    html += '</tbody><tfoot><tr><td class="nr-col"></td><td class="schueler-col">⌀ Klasse</td>';
    fach.lnws.forEach(function (lnw) {
      html += '<td>' + formatSchnitt(lnwSchnitt(lnw, schueler)) + '</td>';
    });
    html += '<td class="schnitt-col">' + formatSchnitt(klassenDurchschnittFach(klasse, fach)) + '</td><td class="druck-ausblenden"></td></tr></tfoot>';
    html += '</table></div>';

    if (ausgeschlosseneAnzahl > 0) {
      html += '<button class="text-btn druck-ausblenden" id="ausgeschlossene-verwalten-btn">' + ausgeschlosseneAnzahl +
        (ausgeschlosseneAnzahl === 1 ? ' Schüler ist' : ' Schüler sind') + ' für dieses Fach ausgeblendet – verwalten</button>';
    }
    return html;
  }

  function formatDatum(iso) {
    if (!iso) return "";
    var teile = iso.split("-");
    if (teile.length !== 3) return iso;
    return teile[2] + "." + teile[1] + ".";
  }

  function formatDatumLang(iso) {
    if (!iso) return "";
    var teile = iso.split("-");
    if (teile.length !== 3) return iso;
    return teile[2] + "." + teile[1] + "." + teile[0];
  }

  function baueLnwDruckHtml(klasse, fach, lnw) {
    var typ = fach.lnwTypen.filter(function (t) { return t.id === lnw.typId; })[0];
    var sichtbare = sichtbareSchueler(klasse, fach);
    var verteilung = [0, 0, 0, 0, 0, 0];
    var zeilen = sichtbare.map(function (s, idx) {
      var wert = lnw.noten[s.id];
      if (wert) { verteilung[(wert === "n.a." ? 6 : parseInt(wert.charAt(0), 10)) - 1]++; }
      return { nr: idx + 1, name: s.name, wert: wert || "–" };
    });
    var maxAnzahl = Math.max.apply(null, verteilung.concat([1]));
    var balken = verteilung.map(function (anzahl, i) {
      var hoehe = Math.round((anzahl / maxAnzahl) * 100);
      return '<div class="druck-balken-saeule"><div class="druck-balken-zahl">' + anzahl + '</div>' +
        '<div class="druck-balken-spur"><div class="druck-balken" style="height:' + hoehe + '%"></div></div>' +
        '<div class="druck-balken-label">' + (i + 1) + '</div></div>';
    }).join("");

    var spaltenAnzahl = zeilen.length > 24 ? 3 : 2;
    var proSpalte = Math.ceil(zeilen.length / spaltenAnzahl) || 1;
    var spalten = [];
    for (var i = 0; i < spaltenAnzahl; i++) {
      spalten.push(zeilen.slice(i * proSpalte, (i + 1) * proSpalte));
    }
    var listeHtml = spalten.map(function (spalte) {
      return '<div class="druck-schuelerliste">' + spalte.map(function (z) {
        return '<div class="druck-schueler-zeile"><span>' + z.nr + '. ' + escapeHtml(z.name) + '</span><span>' + escapeHtml(z.wert) + '</span></div>';
      }).join("") + '</div>';
    }).join("");

    var klassenschnitt = lnwSchnitt(lnw, sichtbare);

    return '<div class="druck-lnw-seite">' +
      '<h1>' + escapeHtml(klasse.name) + ' – ' + escapeHtml(fach.name) + '</h1>' +
      '<h2>' + escapeHtml(typ ? typ.name : "") + (lnw.titel ? ' – „' + escapeHtml(lnw.titel) + '“' : '') + '</h2>' +
      '<p class="druck-lnw-meta">' + (lnw.datum ? formatDatumLang(lnw.datum) : 'kein Datum') + ' · Gewichtung ' + formatGewicht(lnw.gewicht) +
        ' · Klassendurchschnitt ' + formatSchnitt(klassenschnitt) + '</p>' +
      '<div class="druck-diagramm">' + balken + '</div>' +
      '<p class="druck-schueler-titel">Noten</p>' +
      '<div class="druck-schuelerliste-spalten">' + listeHtml + '</div>' +
      '<div class="druck-unterschrift"><span>Unterschrift</span></div>' +
      '</div>';
  }

  function druckeEinzelnenLnw(fach, lnw) {
    var klasse = findeKlasse(ui.klasseId);
    if (!klasse) return;
    document.getElementById("druck-lnw").innerHTML = baueLnwDruckHtml(klasse, fach, lnw);
    document.body.classList.add("druck-einzeln");

    var seitenStil = document.createElement("style");
    seitenStil.id = "druck-einzeln-seite";
    seitenStil.textContent = "@media print { @page { size: A4 portrait; margin: 12mm; } }";
    document.head.appendChild(seitenStil);

    function zurueck() {
      window.removeEventListener("afterprint", zurueck);
      document.body.classList.remove("druck-einzeln");
      var alt = document.getElementById("druck-einzeln-seite");
      if (alt) alt.remove();
    }
    window.addEventListener("afterprint", zurueck);
    window.print();
    setTimeout(zurueck, 15000);
  }

  function escapeHtml(str) {
    return String(str || "").replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // ---------- Dialoge ----------

  function oeffneDialog(innerHtml, onOpen) {
    var alt = document.getElementById("app-dialog");
    if (alt) alt.remove();
    var dlg = document.createElement("dialog");
    dlg.id = "app-dialog";
    dlg.innerHTML = '<div class="dialog-inner">' + innerHtml + '</div>';
    document.body.appendChild(dlg);
    dlg.addEventListener("click", function (e) { if (e.target === dlg) dlg.close(); });
    dlg.showModal();
    if (onOpen) onOpen(dlg);
    return dlg;
  }

    );

  function dialogSchuelerVerwalten(klasse) {
    function zeilenHtml() {
      return klasse.schueler.map(function (s, i) {
        return '<div class="schueler-zeile-edit" data-idx="' + i + '">' +
          '<input type="text" value="' + escapeHtml(s.name) + '" data-schueler-id="' + s.id + '">' +
          '<button data-entfernen="' + s.id + '" title="Entfernen">✕</button></div>';
      }).join("");
    }
    var dlg = oeffneDialog(
      '<h2>Schüler verwalten</h2>' +
      '<div class="schueler-liste-edit" id="d-schueler-liste">' + zeilenHtml() + '</div>' +
      '<button class="btn btn-ghost btn-sm" id="d-schueler-hinzufuegen" style="margin-bottom:16px;">+ Schüler hinzufügen</button>' +
      '<div class="dialog-aktionen"><button class="btn btn-ghost" id="d-schliessen">Fertig</button></div>'
    );

    function bindeZeilen() {
      dlg.querySelectorAll("[data-schueler-id]").forEach(function (input) {
        input.addEventListener("change", function () {
          var s = klasse.schueler.filter(function (x) { return x.id === input.getAttribute("data-schueler-id"); })[0];
          if (s) { s.name = input.value.trim() || s.name; speichereZustand(); }
        });
      });
      dlg.querySelectorAll("[data-entfernen]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var id = btn.getAttribute("data-entfernen");
          klasse.schueler = klasse.schueler.filter(function (s) { return s.id !== id; });
          klasse.faecher.forEach(function (f) {
            f.lnws.forEach(function (lnw) { delete lnw.noten[id]; });
            if (f.ausgeschlosseneSchueler) f.ausgeschlosseneSchueler = f.ausgeschlosseneSchueler.filter(function (x) { return x !== id; });
          });
          speichereZustand();
          dlg.querySelector("#d-schueler-liste").innerHTML = zeilenHtml();
          bindeZeilen();
        });
      });
    }
    bindeZeilen();

    dlg.querySelector("#d-schueler-hinzufuegen").addEventListener("click", function () {
      klasse.schueler.push({ id: neueId(), name: "" });
      speichereZustand();
      dlg.querySelector("#d-schueler-liste").innerHTML = zeilenHtml();
      bindeZeilen();
      var inputs = dlg.querySelectorAll("[data-schueler-id]");
      if (inputs.length) inputs[inputs.length - 1].focus();
    });

    dlg.querySelector("#d-schliessen").addEventListener("click", function () {
      klasse.schueler = klasse.schueler.filter(function (s) { return s.name && s.name.trim(); });
      speichereZustand();
      dlg.close(); render();
    });
  }

      if (liste.length === 0) return '<p style="color:var(--muted);font-size:0.86rem;">Niemand ist ausgeblendet.</p>';
      return liste.map(function (s) {
        return '<div class="typen-zeile"><span class="name">' + escapeHtml(s.name) + '</span>' +

      '<p style="color:var(--muted);font-size:0.84rem;margin-bottom:12px;">Diese Schüler nehmen an diesem Fach nicht teil und tauchen deshalb nicht in der Notentabelle auf.</p>' +
      '<div class="typen-liste" id="d-ausgeschlossene-liste">' + zeilenHtml() + '</div>' +

          dlg.querySelector("#d-ausgeschlossene-liste").innerHTML = zeilenHtml();
          bindeWiederAufnehmen();

    bindeWiederAufnehmen();
    dlg.querySelector("#d-schliessen").addEventListener("click", function () { dlg.close(); render(); });

      if (e.target.value) {
        dlg.querySelectorAll("[data-gewicht]").forEach(function (b) { b.classList.remove("aktiv"); });
        gewaehltesGewicht = parseFloat(e.target.value) || 1;
      }
    });

    function bindeLoeschen() {
      dlg.querySelectorAll("[data-typ-loeschen]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var id = btn.getAttribute("data-typ-loeschen");
          var inBenutzung = fach.lnws.some(function (l) { return l.typId === id; });
          if (inBenutzung) { alert("Dieser Typ wird noch von mindestens einem Leistungsnachweis verwendet und kann nicht gelöscht werden."); return; }
          fach.lnwTypen = fach.lnwTypen.filter(function (t) { return t.id !== id; });
          speichereZustand();
          dlg.querySelector("#d-typen-liste").innerHTML = zeilenHtml();
          bindeLoeschen();
        });
      });
    }
    bindeLoeschen();

    dlg.querySelector("#d-typ-anlegen").addEventListener("click", function () {
      var name = dlg.querySelector("#d-typ-name").value.trim();
      if (!name) return;
      fach.lnwTypen.push({ id: neueId(), name: name, gewicht: gewaehltesGewicht });
      speichereZustand();
      dlg.querySelector("#d-typen-liste").innerHTML = zeilenHtml();
      bindeLoeschen();
      dlg.querySelector("#d-typ-name").value = "";
    });

    dlg.querySelector("#d-schliessen").addEventListener("click", function () { dlg.close(); render(); });
  }

  function dialogNeuerLnw(fach) {
    if (fach.lnwTypen.length === 0) { alert("Lege zuerst mindestens einen LNW-Typ an."); return; }
    var dlg = oeffneDialog(
      '<h2>Neuer Leistungsnachweis</h2>' +
      '<div class="feld"><label for="d-typ">Typ</label><select id="d-typ">' +
        fach.lnwTypen.map(function (t) { return '<option value="' + t.id + '">' + escapeHtml(t.name) + '</option>'; }).join("") +
      '</select></div>' +
      '<div class="feld"><label for="d-titel">Thema (optional)</label><input type="text" id="d-titel" placeholder="z. B. Bruchrechnen"></div>' +
      '<div class="feld"><label for="d-datum">Geschrieben am</label><input type="date" id="d-datum" value="' + heuteIso() + '"></div>' +
      '<div class="feld"><label>Gewichtung</label><div class="gewicht-picks" id="d-gewicht-picks"></div>' +
        '<input type="number" id="d-gewicht-custom" step="0.01"></div>' +
      '<div class="dialog-aktionen"><button class="btn btn-ghost" id="d-abbrechen">Abbrechen</button><button class="btn btn-primary" id="d-speichern">Anlegen</button></div>'
    );

    var gewaehltesGewicht = fach.lnwTypen[0].gewicht;
    function renderGewichtPicks() {
      dlg.querySelector("#d-gewicht-picks").innerHTML = GEWICHT_PRESETS.map(function (p) {
        return '<button type="button" class="gewicht-pick' + (Math.abs(p.wert - gewaehltesGewicht) < 0.001 ? ' aktiv' : '') + '" data-gewicht="' + p.wert + '">' + p.label + '</button>';
      }).join("");
      dlg.querySelectorAll("[data-gewicht]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          gewaehltesGewicht = parseFloat(btn.getAttribute("data-gewicht"));
          dlg.querySelector("#d-gewicht-custom").value = "";
          renderGewichtPicks();
        });
      });
      dlg.querySelector("#d-gewicht-custom").value = GEWICHT_PRESETS.some(function (p) { return Math.abs(p.wert - gewaehltesGewicht) < 0.001; }) ? "" : gewaehltesGewicht;
    }
    renderGewichtPicks();

    dlg.querySelector("#d-typ").addEventListener("change", function (e) {
      var typ = fach.lnwTypen.filter(function (t) { return t.id === e.target.value; })[0];
      if (typ) { gewaehltesGewicht = typ.gewicht; renderGewichtPicks(); }
    });
    dlg.querySelector("#d-gewicht-custom").addEventListener("input", function (e) {
      if (e.target.value) { gewaehltesGewicht = parseFloat(e.target.value) || 1; renderGewichtPicks(); }
    });

    dlg.querySelector("#d-abbrechen").addEventListener("click", function () { dlg.close(); });
    dlg.querySelector("#d-speichern").addEventListener("click", function () {
      var typId = dlg.querySelector("#d-typ").value;
      var titel = dlg.querySelector("#d-titel").value.trim();
      var datum = dlg.querySelector("#d-datum").value;
      fach.lnws.push({ id: neueId(), typId: typId, titel: titel, datum: datum, gewicht: gewaehltesGewicht, noten: {} });
      fach.lnws.sort(function (a, b) { return (a.datum || "9999") < (b.datum || "9999") ? -1 : 1; });
      speichereZustand();
      dlg.close(); render();
    });
  }

  function dialogSchuelerUeberblick(klasse, schueler) {
    var inhalt = klasse.faecher.length === 0
      ? '<p style="color:var(--muted);">Diese Klasse hat noch kein Fach.</p>'
      : klasse.faecher.map(function (f) {
          var schnitt = schuelerSchnitt(f, schueler.id);
          var zeilen = f.lnws.map(function (lnw, i) {
            var typ = f.lnwTypen.filter(function (t) { return t.id === lnw.typId; })[0];
            var wert = lnw.noten[schueler.id];
            return '<div class="ueberblick-zeile"><span>' + (i + 1) + '. ' + escapeHtml(typ ? typ.name : "?") +
              (lnw.titel ? ' – „' + escapeHtml(lnw.titel) + '“' : '') +
              (lnw.datum ? ' (' + formatDatumLang(lnw.datum) + ')' : '') + '</span>' +
              '<span class="note-wert">' + (wert || "–") + '</span></div>';
          }).join("") || '<p style="color:var(--muted);font-size:0.86rem;">Noch keine Leistungsnachweise.</p>';
          return '<div class="ueberblick-fach"><h3>' + escapeHtml(f.name) + '<span class="schnitt-badge-dialog">Ø ' + formatSchnitt(schnitt) + '</span></h3>' + zeilen + '</div>';
        }).join("");

    var dlg = oeffneDialog('<h2>' + escapeHtml(schueler.name) + '</h2>' +
      '<div class="ueberblick-inhalt">' + inhalt + '</div>' +
      '<div class="dialog-aktionen"><button class="btn btn-ghost" id="d-schliessen">Schließen</button></div>'
    );
    dlg.querySelector("#d-schliessen").addEventListener("click", function () { dlg.close(); });
  }

  function dialogLnwPlanen(datumIso) {
    if (zustand.klassen.length === 0) { alert("Lege zuerst eine Klasse an."); return; }
    var dlg = oeffneDialog(
      '<h2>Leistungsnachweis planen</h2>' +
      '<p style="color:var(--muted);font-size:0.86rem;margin-bottom:14px;">am ' + formatDatumLang(datumIso) + '</p>' +
      '<div class="feld"><label for="d-klasse">Klasse</label><select id="d-klasse"></select></div>' +
      '<div class="feld"><label for="d-fach">Fach</label><select id="d-fach"></select></div>' +
      '<div class="feld"><label for="d-typ">Typ</label><select id="d-typ"></select></div>' +
      '<div class="feld"><label for="d-titel">Thema (optional)</label><input type="text" id="d-titel" placeholder="z. B. Bruchrechnen"></div>' +
      '<div class="feld"><label>Gewichtung</label><div class="gewicht-picks" id="d-gewicht-picks"></div>' +
        '<input type="number" id="d-gewicht-custom" step="0.01"></div>' +
      '<div class="dialog-aktionen"><button class="btn btn-ghost" id="d-abbrechen">Abbrechen</button><button class="btn btn-primary" id="d-speichern">Planen</button></div>'
    );

    var gewaehltesGewicht = 1;
    function renderGewichtPicks() {
      dlg.querySelector("#d-gewicht-picks").innerHTML = GEWICHT_PRESETS.map(function (p) {
        return '<button type="button" class="gewicht-pick' + (Math.abs(p.wert - gewaehltesGewicht) < 0.001 ? ' aktiv' : '') + '" data-gewicht="' + p.wert + '">' + p.label + '</button>';
      }).join("");
      dlg.querySelectorAll("[data-gewicht]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          gewaehltesGewicht = parseFloat(btn.getAttribute("data-gewicht"));
          dlg.querySelector("#d-gewicht-custom").value = "";
          renderGewichtPicks();
        });
      });
      dlg.querySelector("#d-gewicht-custom").value = GEWICHT_PRESETS.some(function (p) { return Math.abs(p.wert - gewaehltesGewicht) < 0.001; }) ? "" : gewaehltesGewicht;
    }
    dlg.querySelector("#d-gewicht-custom").addEventListener("input", function (e) {
      if (e.target.value) { gewaehltesGewicht = parseFloat(e.target.value) || 1; renderGewichtPicks(); }
    });

    function befuelleFach() {
      var klasse = findeKlasse(dlg.querySelector("#d-klasse").value);
      var fachSel = dlg.querySelector("#d-fach");
      fachSel.innerHTML = klasse.faecher.map(function (f) { return '<option value="' + f.id + '">' + escapeHtml(f.name) + '</option>'; }).join("");
      befuelleTyp();
    }
    function befuelleTyp() {
      var klasse = findeKlasse(dlg.querySelector("#d-klasse").value);
      var fach = findeFach(klasse, dlg.querySelector("#d-fach").value);
      var typSel = dlg.querySelector("#d-typ");
      if (!fach || fach.lnwTypen.length === 0) { typSel.innerHTML = '<option value="">– keine Typen –</option>'; return; }
      typSel.innerHTML = fach.lnwTypen.map(function (t) { return '<option value="' + t.id + '">' + escapeHtml(t.name) + '</option>'; }).join("");
      gewaehltesGewicht = fach.lnwTypen[0].gewicht;
      renderGewichtPicks();
    }

    dlg.querySelector("#d-klasse").innerHTML = zustand.klassen.map(function (k) { return '<option value="' + k.id + '">' + escapeHtml(k.name) + '</option>'; }).join("");
    dlg.querySelector("#d-klasse").addEventListener("change", befuelleFach);
    dlg.querySelector("#d-fach").addEventListener("change", befuelleTyp);
    befuelleFach();

    dlg.querySelector("#d-abbrechen").addEventListener("click", function () { dlg.close(); });
    dlg.querySelector("#d-speichern").addEventListener("click", function () {
      var klasse = findeKlasse(dlg.querySelector("#d-klasse").value);
      var fach = findeFach(klasse, dlg.querySelector("#d-fach").value);
      var typId = dlg.querySelector("#d-typ").value;
      if (!fach || !typId) { alert("Dieses Fach hat noch keine LNW-Typen. Leg zuerst einen an."); return; }
      var titel = dlg.querySelector("#d-titel").value.trim();
      fach.lnws.push({ id: neueId(), typId: typId, titel: titel, datum: datumIso, gewicht: gewaehltesGewicht, noten: {} });
      fach.lnws.sort(function (a, b) { return (a.datum || "9999") < (b.datum || "9999") ? -1 : 1; });
      speichereZustand();
      dlg.close(); render();
    });
  }

  // ---------- Events ----------

  function bindeEvents(klasse) {
    var neueKlasseBtn = document.getElementById("neue-klasse-btn");
    if (neueKlasseBtn) neueKlasseBtn.addEventListener("click", dialogNeueKlasse);
    var leerNeueKlasseBtn = document.getElementById("leer-neue-klasse-btn");
    if (leerNeueKlasseBtn) leerNeueKlasseBtn.addEventListener("click", dialogNeueKlasse);

    document.querySelectorAll(".klasse-item[data-klasse-id]").forEach(function (el) {
      el.addEventListener("click", function () {
        ui.klasseId = el.getAttribute("data-klasse-id");
        ui.fachId = null;
        ui.ansicht = "klasse";
        render();
      });
    });
    document.querySelectorAll(".klasse-item[data-ansicht]").forEach(function (el) {
      el.addEventListener("click", function () {
        ui.ansicht = el.getAttribute("data-ansicht");
        render();
      });
    });

    if (ui.ansicht === "kalender") {
      var monatZurueck = document.getElementById("monat-zurueck");
      if (monatZurueck) monatZurueck.addEventListener("click", function () {
        ui.kalenderMonat--;
        if (ui.kalenderMonat < 0) { ui.kalenderMonat = 11; ui.kalenderJahr--; }
        render();
      });
      var monatVor = document.getElementById("monat-vor");
      if (monatVor) monatVor.addEventListener("click", function () {
        ui.kalenderMonat++;
        if (ui.kalenderMonat > 11) { ui.kalenderMonat = 0; ui.kalenderJahr++; }
        render();
      });
      var monatHeute = document.getElementById("monat-heute");
      if (monatHeute) monatHeute.addEventListener("click", function () {
        var h = new Date(); ui.kalenderJahr = h.getFullYear(); ui.kalenderMonat = h.getMonth(); render();
      });
      var jahresuebersichtBtn = document.getElementById("jahresuebersicht-btn");
      if (jahresuebersichtBtn) jahresuebersichtBtn.addEventListener("click", function () { ui.kalenderModus = "jahr"; render(); });
      var monatsansichtBtn = document.getElementById("monatsansicht-btn");
      if (monatsansichtBtn) monatsansichtBtn.addEventListener("click", function () { ui.kalenderModus = "monat"; render(); });
      var schuljahrZurueck = document.getElementById("schuljahr-zurueck");
      if (schuljahrZurueck) schuljahrZurueck.addEventListener("click", function () {
        ui.kalenderJahr = schuljahrStart(ui.kalenderJahr, ui.kalenderMonat) - 1; ui.kalenderMonat = 8; render();
      });
      var schuljahrVor = document.getElementById("schuljahr-vor");
      if (schuljahrVor) schuljahrVor.addEventListener("click", function () {
        ui.kalenderJahr = schuljahrStart(ui.kalenderJahr, ui.kalenderMonat) + 1; ui.kalenderMonat = 8; render();
      });
      document.querySelectorAll(".mini-monat").forEach(function (btn) {
        btn.addEventListener("click", function () {
          ui.kalenderJahr = parseInt(btn.getAttribute("data-mini-jahr"), 10);
          ui.kalenderMonat = parseInt(btn.getAttribute("data-mini-monat"), 10);
          ui.kalenderModus = "monat";
          render();
        });
      });
      document.querySelectorAll("[data-tag-plus]").forEach(function (btn) {
        btn.addEventListener("click", function () { dialogLnwPlanen(btn.getAttribute("data-tag-plus")); });
      });
      document.querySelectorAll("[data-termin-klasse]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          ui.klasseId = btn.getAttribute("data-termin-klasse");
          ui.fachId = btn.getAttribute("data-termin-fach");
          ui.ansicht = "klasse";
          render();
        });
      });
    }

    if (ui.ansicht === "stundenplan") {
      var spDatei = document.getElementById("stundenplan-datei");
      var hochladenBtn = document.getElementById("stundenplan-hochladen-btn");
      var ersetzenBtn = document.getElementById("stundenplan-ersetzen-btn");
      var entfernenBtn = document.getElementById("stundenplan-entfernen-btn");
      if (hochladenBtn && spDatei) hochladenBtn.addEventListener("click", function () { spDatei.click(); });
      if (ersetzenBtn && spDatei) ersetzenBtn.addEventListener("click", function () { spDatei.click(); });
      if (spDatei) spDatei.addEventListener("change", function () {
        var datei = spDatei.files[0];
        if (!datei) return;
        var reader = new FileReader();
        reader.onload = function () {
          var alt = zustand.stundenplan;
          zustand.stundenplan = { dataUrl: reader.result, dateiname: datei.name, typ: datei.type, hochgeladenAm: heuteIso() };
          if (!speichereZustand()) {
            zustand.stundenplan = alt;
            alert("Die Datei ist zu groß für den lokalen Speicher. Versuch ein kleineres Foto oder eine komprimierte PDF.");
            return;
          }
          render();
        };
        reader.readAsDataURL(datei);
      });
      if (entfernenBtn) entfernenBtn.addEventListener("click", function () {
        if (!confirm("Stundenplan entfernen?")) return;
        zustand.stundenplan = null; speichereZustand(); render();
      });
    }

    document.querySelectorAll("[data-schueler-uebersicht]").forEach(function (el) {
      el.addEventListener("click", function () {
        if (!klasse) return;
        var s = klasse.schueler.filter(function (x) { return x.id === el.getAttribute("data-schueler-uebersicht"); })[0];
        if (s) dialogSchuelerUeberblick(klasse, s);
      });
    });

    if (!klasse || ui.ansicht !== "klasse") return;

    var schuelerBtn = document.getElementById("schueler-verwalten-btn");
    if (schuelerBtn) schuelerBtn.addEventListener("click", function () { dialogSchuelerVerwalten(klasse); });
    var leeresFachSchuelerBtn = document.getElementById("leeres-fach-schueler-btn");
    if (leeresFachSchuelerBtn) leeresFachSchuelerBtn.addEventListener("click", function () { dialogSchuelerVerwalten(klasse); });
    var umbenennenBtn = document.getElementById("klasse-umbenennen-btn");
    if (umbenennenBtn) umbenennenBtn.addEventListener("click", function () { dialogKlasseUmbenennen(klasse); });
    var loeschenBtn = document.getElementById("klasse-loeschen-btn");
    if (loeschenBtn) loeschenBtn.addEventListener("click", function () { dialogKlasseLoeschen(klasse); });

    var neuesFachBtn = document.getElementById("neues-fach-btn");
    if (neuesFachBtn) neuesFachBtn.addEventListener("click", function () { dialogNeuesFach(klasse); });
    var leeresFachNeuBtn = document.getElementById("leeres-fach-neu-btn");
    if (leeresFachNeuBtn) leeresFachNeuBtn.addEventListener("click", function () { dialogNeuesFach(klasse); });

    document.querySelectorAll(".fach-tab").forEach(function (el) {
      el.addEventListener("click", function () { ui.fachId = el.getAttribute("data-fach-id"); render(); });
    });

    var fach = findeFach(klasse, ui.fachId);
    if (fach) {
      var neuerLnwBtn = document.getElementById("neuer-lnw-btn");
      if (neuerLnwBtn) neuerLnwBtn.addEventListener("click", function () { dialogNeuerLnw(fach); });
      var leeresFachLnwBtn = document.getElementById("leeres-fach-lnw-btn");
      if (leeresFachLnwBtn) leeresFachLnwBtn.addEventListener("click", function () { dialogNeuerLnw(fach); });
      var notenBearbeitenBtn = document.getElementById("noten-bearbeiten-btn");
      if (notenBearbeitenBtn) notenBearbeitenBtn.addEventListener("click", function () {
        fach.notenEntsperrt = true; speichereZustand(); render();
      });
      var notenSperrenBtn = document.getElementById("noten-sperren-btn");
      if (notenSperrenBtn) notenSperrenBtn.addEventListener("click", function () {
        fach.notenEntsperrt = false; speichereZustand(); render();
      });
      var typenBtn = document.getElementById("typen-verwalten-btn");
      if (typenBtn) typenBtn.addEventListener("click", function () { dialogTypenVerwalten(fach); });
      var fachUmbenennenBtn = document.getElementById("fach-umbenennen-btn");
      if (fachUmbenennenBtn) fachUmbenennenBtn.addEventListener("click", function () { dialogFachUmbenennen(fach); });
      var fachLoeschenBtn = document.getElementById("fach-loeschen-btn");
      if (fachLoeschenBtn) fachLoeschenBtn.addEventListener("click", function () { dialogFachLoeschen(klasse, fach); });
      var druckenBtn = document.getElementById("drucken-btn");
      if (druckenBtn) druckenBtn.addEventListener("click", function () { window.print(); });

      document.querySelectorAll("[data-lnw-drucken]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var id = btn.getAttribute("data-lnw-drucken");
          var lnw = fach.lnws.filter(function (l) { return l.id === id; })[0];
          if (lnw) druckeEinzelnenLnw(fach, lnw);
        });
      });

      document.querySelectorAll("[data-lnw-loeschen]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var id = btn.getAttribute("data-lnw-loeschen");
          if (!confirm("Diesen Leistungsnachweis mit allen Noten löschen?")) return;
          fach.lnws = fach.lnws.filter(function (l) { return l.id !== id; });
          speichereZustand(); render();
        });
      });

      document.querySelectorAll("[data-schueler-entfernen]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var id = btn.getAttribute("data-schueler-entfernen");
          if (!fach.ausgeschlosseneSchueler) fach.ausgeschlosseneSchueler = [];
          if (fach.ausgeschlosseneSchueler.indexOf(id) === -1) fach.ausgeschlosseneSchueler.push(id);
          speichereZustand(); render();
        });
      });

      var ausgeschlosseneBtn = document.getElementById("ausgeschlossene-verwalten-btn");
      if (ausgeschlosseneBtn) ausgeschlosseneBtn.addEventListener("click", function () { dialogAusgeschlosseneVerwalten(klasse, fach); });

      document.querySelectorAll("select.noten-select").forEach(function (sel) {
        sel.addEventListener("change", function () {
          var lnwId = sel.getAttribute("data-lnw-id");
          var schuelerId = sel.getAttribute("data-schueler-id");
          var lnw = fach.lnws.filter(function (l) { return l.id === lnwId; })[0];
          if (!lnw) return;
          if (sel.value) lnw.noten[schuelerId] = sel.value; else delete lnw.noten[schuelerId];
          speichereZustand();
          render();
        });
      });
    }

    var exportBtn = document.getElementById("export-btn");
    if (exportBtn) exportBtn.addEventListener("click", exportieren);
    var importBtn = document.getElementById("import-btn");
    var importDatei = document.getElementById("import-datei");
    if (importBtn && importDatei) {
      importBtn.addEventListener("click", function () { importDatei.click(); });
      importDatei.addEventListener("change", function () {
        var datei = importDatei.files[0];
        if (!datei) return;
        var reader = new FileReader();
        reader.onload = function () {
          try {
            var neu = JSON.parse(reader.result);
            if (!neu || !Array.isArray(neu.klassen)) throw new Error("ungültig");
            if (!confirm("Sicherung einspielen? Das ersetzt alle aktuell gespeicherten Klassen auf diesem Gerät.")) return;
            zustand = neu; speichereZustand();
            ui.klasseId = null; ui.fachId = null;
            render();
          } catch (e) { alert("Die Datei konnte nicht gelesen werden. Ist es eine Notenbuch-Sicherungsdatei?"); }
        };
        reader.readAsText(datei);
      });
    }
  }

  function exportieren() {
    var daten = JSON.stringify(zustand, null, 2);
    var blob = new Blob([daten], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var heute = new Date().toISOString().slice(0, 10);
    a.href = url; a.download = "notenbuch-sicherung-" + heute + ".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  render();
})();
</script>
</body>
</html>
